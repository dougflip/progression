        ${
          role === "chords" && !g.patches[AGENT_PATCH.id]
            ? `<div class="card" style="margin-top:.6rem">
                <div class="muted">Describe a sound → an agent skill returns a patch (JSON) → it's embedded in the song.</div>
                <div class="row" style="margin-top:.45rem">
                  <input class="text" style="flex:1" value="a glassy 80s bell" disabled />
                  <button class="btn" data-act="agentPatch">Simulate agent</button>
                </div></div>`
            : ""
        }
        <div class="muted" style="margin-top:.7rem">Selected patch (built-ins are referenced by id; custom patches live in <code>song.patches</code>):</div>
        <pre class="json">${esc(JSON.stringify(selPatch, null, 2))}</pre>`;
      }

      function renderSectionSettings() {
        const g = S.song;
        const sec = curSec();
        const o = sec.overrides;
        const chordChoices = [["", "Song default (" + patchLabel(g.instruments.chords) + ")"]];
        Object.entries(BUILTIN_PATCHES).forEach(([id, p]) => p.role === "chords" && chordChoices.push([id, p.label]));
        Object.entries(g.patches).forEach(([id, p]) => p.role === "chords" && chordChoices.push([id, p.label]));
        return `
        <div class="row"><h3 style="flex:1">Section settings</h3><button class="btn small" data-act="closeSheet">Done</button></div>
        <div class="muted" style="margin-top:.3rem">Blank = inherit from the song. Only what you set is stored in <code>overrides</code>.</div>
        <div class="form">
          <span>Name</span><input class="text" value="${esc(sec.name)}" data-field="sec.name" />
          <span>Tempo</span><input class="text" type="number" placeholder="${g.defaults.tempo} (song)" value="${o.tempo || ""}" data-field="sec.tempo" />
          <span>Meter</span>
          <select class="text" data-field="sec.meter">
            <option selected>4/4 (song)</option><option disabled>3/4 — later</option><option disabled>6/8 — later</option>
          </select>
          <span>Swing</span>
          <select class="text" data-field="sec.swing">${opts(
            [["", "Song default"], ["0", "Straight"], ["0.33", "Light"], ["0.66", "Heavy"]],
            o.swing == null ? "" : String(o.swing),
          )}</select>
          <span>Voicing</span>
          <select class="text" data-field="sec.voicing">${opts(
            [["", "Song default"], ...VOICINGS],
            o.voicing || "",
          )}</select>
          <span>Chord sound</span>
          <select class="text" data-field="sec.chordsPatch">${opts(chordChoices, (o.instruments && o.instruments.chords) || "")}</select>
        </div>
        <div class="row" style="margin-top:1rem">
          <button class="btn danger" data-act="secDel">Delete section</button>
        </div>`;
      }

      const practiceDiffers = () => JSON.stringify(S.practice) !== JSON.stringify(DEFAULT_PRACTICE);
      const includePractice = () => (S.sharePractice == null ? practiceDiffers() : S.sharePractice);

      function practiceSummary() {
        const p = S.practice;
        const parts = [];
        if (p.cycle === "custom") parts.push("cycle " + (p.customKeys.join(" ") || "(no keys)"));
        else if (p.cycle !== "none") parts.push("cycle in " + p.cycle);
        if (p.advance === "manual") parts.push("manual advance");
        const muted = CHANNELS.filter(([ch]) => p.mutes[ch]).map(([ch]) => ch);
        if (muted.length) parts.push(muted.join(" + ") + " muted");
        return parts.join(", ") || "defaults";
      }

      // What a link carries: a versioned envelope. New blocks (e.g. mix) can be added later.
      function shareEnvelope() {
        const env = { version: 2, doc: S.mode === "backing" ? S.recipe : S.song };
        if (includePractice()) env.practice = S.practice;
        return env;
      }

      function renderShareSheet() {
        const inc = includePractice();
        return `
        <div class="row"><h3 style="flex:1">Share</h3><button class="btn small" data-act="closeSheet">Close</button></div>
        <div class="card" style="margin-top:.7rem">
          <b>Link</b>
          <div class="muted">Opens as a new item in the other person's library. <code>{ version, doc, practice? }</code> → JSON → deflate → base64url in one <code>?s=</code> param.</div>
          <div class="opt ${inc ? "on" : ""}" style="margin-top:.55rem" data-act="sharePractice">
            <span>${inc ? "☑" : "☐"}</span>
            <span style="flex:1">Include practice settings<br><span class="muted">${esc(practiceSummary())}</span></span>
          </div>
          <div id="share-stats" class="muted" style="margin-top:.4rem">Measuring…</div>
          <div class="muted" style="margin-top:.3rem">Never included: loop audio, cached samples, volume levels, playback position, app preferences.</div>
        </div>
        <div class="card">
          <b>Recording</b> <span class="badge">later</span>
          <div class="muted">Record the master output to an audio file and share it (Web Share API on mobile). Includes loops.</div>
        </div>
        <div class="card">
          <b>Project file</b> <span class="badge">later</span>
          <div class="muted">One file with the song JSON plus loop audio; the other person imports it and can edit.</div>
        </div>`;
      }

      async function computeShare() {
        const el = document.getElementById("share-stats");
        if (!el) return;
        const json = JSON.stringify(shareEnvelope());
        let enc = "";
        try {
          const stream = new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"));
          const buf = new Uint8Array(await new Response(stream).arrayBuffer());
          let bin = "";
          buf.forEach((b) => (bin += String.fromCharCode(b)));
          enc = btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        } catch {
          el.textContent = "CompressionStream unavailable in this browser.";
          return;
        }
        const url = "https://dougflip.github.io/progression/v2/?s=" + enc;
        el.innerHTML = `JSON ${json.length.toLocaleString()} chars → URL <b>${url.length.toLocaleString()}</b> chars ${
          url.length > 2000 ? '<span class="badge" style="color:var(--queued)">long for some chat apps</span>' : ""
        }`;
      }

      // ═══════════════════════════════════════════════════════════════════
      // Fake playback: reads a snapshot, refreshed only at bar boundaries
      // ═══════════════════════════════════════════════════════════════════
      function loopingSectionId() {
        return S.mode === "composer" && S.view.screen === "section" ? S.view.sectionId : null;
      }
      function playSection() {
        const snap = S.play.snapshot;
        if (!snap) return null;
        const loopId = loopingSectionId();
        return findSec(snap, loopId || snap.arrangement[S.play.arrIdx]);
      }
      function currentChordIndex() {
        const sec = playSection();
        if (!sec) return -1;
        return sec.chords.findIndex((c) => S.play.tick >= c.start && S.play.tick < c.start + c.duration);
      }
      function tempoOf(snap, sec) {
        return (sec && sec.overrides && sec.overrides.tempo) || snap.defaults.tempo;
      }

      // ▶: resume from the cued/paused bar if there is one, else from the top.
      function startPlay() {
        const song = liveSong();
        if (!song || !song.sections.length) return;
        const pos = S.cue ? clampPos(song, S.cue) : { arrIdx: 0, lap: 0, bar: 0 };
        S.cue = null;
        S.play = {
          on: true,
          tick: pos.bar * barTicks(),
          arrIdx: pos.arrIdx,
          lap: pos.lap,
          jump: null,
          keyJump: null,
          snapshot: structuredClone(song),
          dirty: false,
          last: performance.now(),
        };
        render();
        requestAnimationFrame(step);
      }
      // ❚❚: stop sound, remember the bar we were in.
      function pausePlay() {
        S.cue = { arrIdx: S.play.arrIdx, lap: S.play.lap, bar: Math.floor(S.play.tick / barTicks()), paused: true };
        S.play.on = false;
        render();
      }
      // ■: stop sound, forget the position.
      function stopPlay() {
        S.play.on = false;
        S.cue = null;
        render();
      }

      // Key jumps are the one exception to "next bar": they land at the end of the
      // current lap, so tapping the current key repeats it and any other key skips to it.
      function nextLap(p) {
        if (p.keyJump != null) {
          p.lap = p.keyJump;
          p.keyJump = null;
        } else p.lap++;
      }

      function step(now) {
        if (!S.play.on) return;
        const p = S.play;
        const dt = (now - p.last) / 1000;
        p.last = now;
        let sec = playSection();
        if (!sec) {
          // section vanished (deleted/new) — pick up the latest data and restart it
          p.snapshot = structuredClone(liveSong());
          p.tick = 0;
          p.arrIdx = 0;
          sec = playSection();
          if (!sec) return stopPlay();
        }
        const prevBar = Math.floor(p.tick / barTicks());
        p.tick += dt * (tempoOf(p.snapshot, sec) / 60) * PPQ;
        const len = sectionTicks(sec, p.snapshot);
        let crossed = Math.floor(p.tick / barTicks()) !== prevBar;
        if (p.tick >= len) {
          p.tick -= len;
          crossed = true;
          if (loopingSectionId()) {
            nextLap(p); // looping one section: each pass is a cycle lap
          } else if (S.practice.advance === "auto") {
            p.arrIdx++;
            if (p.arrIdx >= p.snapshot.arrangement.length) {
              p.arrIdx = 0;
              nextLap(p); // arrangement finished → next key in the cycle
            }
          } else if (p.keyJump != null) {
            // manual: the arrangement never finishes, so a queued key lands at the end of this section
            nextLap(p);
          } // manual: repeat this arrangement position until a jump is queued
        }
        // Queued jumps (section or chord) land on the next bar, at the start of the target bar.
        if (crossed && p.jump) {
          const over = p.tick % barTicks();
          if (!loopingSectionId()) p.arrIdx = Math.min(p.jump.arrIdx, p.snapshot.arrangement.length - 1);
          p.tick = p.jump.bar * barTicks() + over;
          p.jump = null;
          const target = playSection();
          if (target && p.tick >= sectionTicks(target, p.snapshot)) p.tick = over;
        }
        // The engine only looks at new data at bar boundaries.
        if (crossed && p.dirty) {
          p.snapshot = structuredClone(liveSong());
          p.dirty = false;
          if (p.arrIdx >= p.snapshot.arrangement.length) p.arrIdx = 0;
          toast("Edit applied");
          safeRender();
        } else if (crossed) {
          safeRender();
        } else {
          updatePlayUI();
        }
        requestAnimationFrame(step);
      }

      function updatePlayUI() {
        const pos = document.getElementById("pos");
        const ph = document.getElementById("playhead");
        const player = document.getElementById("player");
        if (!S.play.on || !S.play.snapshot) {
          if (ph) ph.hidden = true;
          return;
        }
        const sec = playSection();
        if (!sec) return;
        const bar = Math.floor(S.play.tick / barTicks()) + 1;
        const beat = Math.floor((S.play.tick % barTicks()) / PPQ) + 1;
        const ci = currentChordIndex();
        const chord = ci >= 0 ? sec.chords[ci] : null;
        // Player header: active chip, bar-progress within it, beat dots (cheap DOM toggles, no re-render).
        if (player && player.dataset.sec === sec.id) {
          player.querySelectorAll(".chip").forEach((el, i) => {
            el.classList.toggle("active", i === ci);
            if (i === ci) {
              const barInChord = Math.floor((S.play.tick - chord.start) / barTicks());
              el.querySelectorAll(".bar-dot").forEach((d, b) => d.classList.toggle("active", b === barInChord));
            }
          });
          player.querySelectorAll(".beat-dot").forEach((d, b) => d.classList.toggle("active", b === beat - 1));
        }
        const keys = lapKeys(S.play.snapshot, S.practice);
        const key = playKey();
        const muted = CHANNELS.filter(([ch]) => S.practice.mutes[ch]).map(([ch]) => ch);
        if (pos)
          pos.innerHTML = `<b>${esc(sec.name)}</b> · bar ${bar} · beat ${beat}${
            chord ? ` · <b>${esc(chordName(chord, key))}</b>` : ""
          }<br><span class="muted">${keys.length > 1 ? `key ${key} (${(S.play.lap % keys.length) + 1}/${keys.length}) · ` : ""}♩ ${tempoOf(S.play.snapshot, sec)}${
            S.practice.advance === "manual" && !loopingSectionId() ? " · manual" : ""
          }${muted.length ? " · muted: " + muted.join(", ") : ""}${
            S.play.dirty ? ' · <span style="color:var(--queued)">edit queued for next bar</span>' : ""
          }${loopingSectionId() ? " · looping section" : ""}</span>`;
        if (ph) {
          const showing = sec.id === S.view.sectionId;
          ph.hidden = !showing;
          ph.style.left = 60 + (S.play.tick / SIX) * CELL + "px";
        }
      }

      // Playback-driven re-renders must not steal focus from a field being edited.
      let deferredRender = false;
      function safeRender() {
        const a = document.activeElement;
        if (a && (a.tagName === "INPUT" || a.tagName === "SELECT")) {
          deferredRender = true;
          updatePlayUI();
        } else render();
      }
      document.addEventListener("focusout", () => {
        if (deferredRender) {
          deferredRender = false;
          setTimeout(render, 0);
        }
      });

      let toastTimer;
      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.hidden = false;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => (el.hidden = true), 1600);
      }

      // ═══════════════════════════════════════════════════════════════════
      // Actions
      // ═══════════════════════════════════════════════════════════════════
      function clampChord(sec, i) {
        // keep chord within section and not overlapping its neighbours
        const c = sec.chords[i];
        const end = sec.bars * barTicks();
        const sorted = sec.chords.filter((x) => x !== c);
        const next = sorted.filter((x) => x.start >= c.start).sort((a, b) => a.start - b.start)[0];
        const limit = next ? next.start : end;
        c.duration = Math.max(EIGHTH, Math.min(c.duration, limit - c.start));
      }
      function sortChords(sec, keep) {
        sec.chords.sort((a, b) => a.start - b.start);
        S.view.selChord = keep ? sec.chords.indexOf(keep) : null;
      }

      function readRegenSeed() {
        const v = (id) => document.getElementById(id).value;
        return {
          progression: v("regen-prog"),
          barsPerChord: Number(v("regen-bpc")),
          style: v("regen-style"),
          drums: v("regen-drums"),
          bass: v("regen-bass"),
        };
      }

      const ACTIONS = {
        mode(d) {
          S.mode = d.mode;
          S.view = { screen: "play", sectionId: null, selChord: null, confirm: null };
          if (S.play.on || S.cue) stopPlay();
          render();
        },
        // Play view ⇄ edit. Playback is unaffected by navigation.
        edit() {
          S.view = { screen: S.mode === "backing" ? "edit" : "song", sectionId: null, selChord: null, confirm: null };
          render();
        },
        done() {
          S.view = { screen: "play", sectionId: null, selChord: null, confirm: null };
          render();
        },
        theme() {
          const h = document.documentElement;
          h.dataset.theme = h.dataset.theme === "dark" ? "light" : "dark";
        },
        sheet(d) {
          S.sheet = { type: d.type };
          render();
        },
        closeSheet() {
          S.sheet = null;
          render();
        },
        dataScope(d) {
          S.dataScope = d.s;
          render();
        },
        confirmNo() {
          S.view.confirm = null;
          render();
        },

        // backing track
        rsecAdd() {
          const id = uid("R");
          S.recipe.sections.push({ id, name: "Bridge", progression: "vi IV I V", barsPerChord: 1, style: null, tempo: null });
          edited();
        },
        rsecDel(d) {
          const s = S.recipe.sections[d.i];
          if (S.recipe.sections.length < 2) return;
          S.recipe.sections.splice(d.i, 1);
          S.recipe.arrangement = S.recipe.arrangement.filter((id) => id !== s.id);
          edited();
        },
        arrAdd(d) {
          (d.p === "r" ? S.recipe : S.song).arrangement.push(d.id);
          edited();
        },
        arrDel(d) {
          const arr = (d.p === "r" ? S.recipe : S.song).arrangement;
          if (arr.length < 2) return;
          arr.splice(Number(d.i), 1);
          edited();
        },
        // Creates a NEW song item; the recipe item is untouched.
        openComposer() {
          const song = generateSong(S.recipe);
          song.title = S.recipe.title === "Scratch" ? "Untitled song" : S.recipe.title + " (song)";
          const item = addItem(song, structuredClone(S.practice));
          openItem(item.id);
          S.view.screen = "song";
          render();
          toast("New song added to your library");
        },
        blankSong() {
          const song = generateSong(mkRecipe("Untitled song", [["A", "Section 1", "I"]], {}));
          song.sections[0].bars = 4;
          song.sections[0].chords[0].duration = 4 * barTicks();
          const item = addItem(song);
          openItem(item.id);
          S.view.screen = "song";
          render();
        },

        // library
        openItem(d) {
          openItem(d.id);
        },
        keepScratch(d = {}) {
          const name = (document.getElementById(d.input || "scratch-name").value || "").trim();
          if (!name) return toast("Give it a name first");
          const sc = S.library.find((i) => i.scratch);
          const item = addItem({ ...structuredClone(sc.doc), title: name }, structuredClone(sc.practice));
          // Scratch resets to a fresh starter so it's ready for the next jam.
          sc.doc = { ...structuredClone(STARTERS[0].doc), title: "Scratch" };
          sc.practice = structuredClone(DP);
          sc.modified = false;
          openItem(item.id);
          toast(`Saved “${name}”`);
        },
        loadStarter(d) {
          const sc = S.library.find((i) => i.scratch);
          if (sc.modified && !(S.libConfirm && S.libConfirm.type === "starter" && S.libConfirm.i === d.i)) {
            S.libConfirm = { type: "starter", i: d.i };
            return render();
          }
          const st = STARTERS[Number(d.i)];
          sc.doc = { ...structuredClone(st.doc), title: "Scratch" };
          sc.practice = structuredClone(st.practice);
          sc.modified = false;
          sc.updated = Date.now();
          openItem("scratch");
          toast(`Scratch: ${st.doc.title}`);
        },
        dupItem(d) {
          const src = S.library.find((i) => i.id === d.id);
          const title = src.scratch ? "Scratch copy" : src.doc.title + " copy";
          addItem({ ...structuredClone(src.doc), title }, structuredClone(src.practice));
          render();
        },
        delItem(d) {
          S.libConfirm = { type: "delete", id: d.id };
          render();
        },
        delYes() {
          const id = S.libConfirm.id;
          S.library = S.library.filter((i) => i.id !== id); // a song's loop takes go with it
          S.libConfirm = null;
          if (S.currentId === id) openItem("scratch");
          else render();
        },
        libCancel() {
          S.libConfirm = null;
          render();
        },
        // Pasted agent JSON and opened share links take the same path: validate, add, open.
        importJson() {
          const text = document.getElementById("import-json").value;
          let env;
          try {
            env = JSON.parse(text);
          } catch {
            return toast("Not valid JSON");
          }
          const doc = env && env.doc ? env.doc : env;
          const err = validateDoc(doc);
          if (err) return toast("Can't import: " + err);
          const item = addItem(doc, env.practice ? { ...structuredClone(DP), ...env.practice } : null, { source: "import" });
          openItem(item.id);
          toast("Imported into your library");
        },
        simulateLink() {
          const doc = generateSong(
            mkRecipe("Funky idea", [["A", "Groove", "i7 IV7 i7 IV7"], ["B", "Turn", "bVI7 V7"]], {
              style: "funk",
              tempo: 104,
              arrangement: ["A", "A", "B"],
            }),
          );
          doc.title = "Funky idea";
          const env = { version: 2, doc, practice: { ...structuredClone(DP), cycle: "5ths" } };
          const item = addItem(env.doc, env.practice, { shared: true });
          openItem(item.id);
          toast("Opened a shared link → added to your library");
        },

        // composer: song screen
        openSection(d) {
          S.view = { screen: "section", sectionId: d.id, selChord: null, confirm: null };
          render();
        },
        backToSong() {
          S.view = { screen: "song", sectionId: null, selChord: null, confirm: null };
          render();
        },
        addSection() {
          const id = uid("s");
          const sec = generateSection(id, "Section " + (S.song.sections.length + 1), {
            progression: "",
            barsPerChord: 1,
            style: "pop",
          });
          sec.bars = 4;
          sec.drums = { kick: [], snare: [], hat: [] };
          S.song.sections.push(sec);
          S.song.arrangement.push(id);
          ACTIONS.openSection({ id });
          edited();
        },
        instRole(d) {
          S.sheet.role = d.r;
          render();
        },
        pickPatch(d) {
          S.song.instruments[S.sheet.role || "chords"] = d.id;
          edited();
        },
        agentPatch() {
          S.song.patches[AGENT_PATCH.id] = structuredClone(AGENT_PATCH.patch);
          S.song.instruments.chords = AGENT_PATCH.id;
          edited();
        },

        // composer: section editor
        bars(d) {
          const sec = curSec();
          const n = Math.min(16, Math.max(1, sec.bars + Number(d.d)));
          sec.bars = n;
          const end = n * barTicks();
          sec.chords = sec.chords.filter((c) => c.start < end);
          sec.chords.forEach((c) => (c.duration = Math.min(c.duration, end - c.start)));
          for (const k of DRUMS) sec.drums[k] = sec.drums[k].filter((t) => t < end);
          sec.bass = sec.bass.filter((b) => b.start < end);
          S.view.selChord = null;
          edited();
        },
        chordCell(d) {
          const sec = curSec();
          const t = Number(d.e) * EIGHTH;
          const hit = sec.chords.findIndex((c) => t >= c.start && t < c.start + c.duration);
          if (hit >= 0) {
            S.view.selChord = hit;
            return render();
          }
          const next = sec.chords.filter((c) => c.start > t).sort((a, b) => a.start - b.start)[0];
          const end = Math.min(next ? next.start : sec.bars * barTicks(), t + barTicks());
          const c = { start: t, duration: end - t, root: { degree: 1, accidental: 0 }, quality: "maj" };
          sec.chords.push(c);
          sortChords(sec, c);
          edited();
        },
        selChord(d) {
          S.view.selChord = S.view.selChord === Number(d.i) ? null : Number(d.i);
          render();
        },
        setNumeral(d) {
          const sec = curSec();
          const p = parseNumeral(d.n.replace("♭", "b"));
          if (!p) return;
          Object.assign(sec.chords[S.view.selChord], p);
          edited();
        },
        dur(d) {
          const sec = curSec();
          const c = sec.chords[S.view.selChord];
          c.duration += Number(d.d) * EIGHTH;
          clampChord(sec, S.view.selChord);
          edited();
        },
        nudge(d) {
          const sec = curSec();
          const c = sec.chords[S.view.selChord];
          const t = c.start + Number(d.d) * EIGHTH;
          const others = sec.chords.filter((x) => x !== c);
          const end = sec.bars * barTicks();
          if (t < 0 || t + c.duration > end) return;
          if (others.some((x) => t < x.start + x.duration && t + c.duration > x.start)) return;
          c.start = t;
          sortChords(sec, c);
          edited();
        },
        split() {
          const sec = curSec();
          const c = sec.chords[S.view.selChord];
          const half = Math.round(c.duration / 2 / EIGHTH) * EIGHTH;
          const b = { ...structuredClone(c), start: c.start + half, duration: c.duration - half };
          c.duration = half;
          sec.chords.push(b);
          sortChords(sec, b);
          edited();
        },
        chordDel() {
          const sec = curSec();
          sec.chords.splice(S.view.selChord, 1);
          S.view.selChord = null;
          edited();
        },
        drum(d) {
          const lane = curSec().drums[d.d];
          const t = Number(d.s) * SIX;
          const i = lane.indexOf(t);
          if (i >= 0) lane.splice(i, 1);
          else {
            lane.push(t);
            lane.sort((a, b) => a - b);
          }
          edited();
        },
        bass(d) {
          const sec = curSec();
          const t = Number(d.s) * SIX;
          const i = sec.bass.findIndex((b) => b.start === t);
          const cycle = [1, 3, 5, 7];
          if (i < 0) {
            sec.bass.push({ start: t, duration: SIX, pitch: { kind: "chordTone", tone: 1 } });
            sec.bass.sort((a, b) => a.start - b.start);
          } else {
            const k = cycle.indexOf(sec.bass[i].pitch.tone);
            if (k === cycle.length - 1) sec.bass.splice(i, 1);
            else sec.bass[i].pitch.tone = cycle[k + 1];
          }
          edited();
        },
        takeAdd() {
          const sec = curSec();
          const n = sec.loops.length + 1;
          sec.loops.push({ id: uid("take-"), name: "Take " + n, audio: "idb:" + uid("take-"), bars: sec.bars, gain: 1, muted: false });
          toast("(simulated) recorded " + sec.bars + " bars");
          edited();
        },
        takeMute(d) {
          const t = curSec().loops[d.i];
          t.muted = !t.muted;
          edited();
        },
        takeDel(d) {
          curSec().loops.splice(d.i, 1);
          edited();
        },
        regen() {
          S.view.confirm = "regen";
          render();
        },
        regenYes() {
          const sec = curSec();
          const fresh = generateSection(sec.id, sec.name, readRegenSeed());
          Object.assign(sec, { bars: fresh.bars, chords: fresh.chords, drums: fresh.drums, bass: fresh.bass, seed: fresh.seed });
          S.view.confirm = null;
          S.view.selChord = null;
          edited();
        },
        restyle() {
          const sec = curSec();
          const { style, drums, bass } = readRegenSeed();
          sec.seed = { ...(sec.seed || {}), style, drums, bass };
          applyStyle(sec, sec.seed);
          edited();
        },

        // practice
        advance() {
          S.practice.advance = S.practice.advance === "auto" ? "manual" : "auto";
          edited();
        },
        // Jumps: while playing they're queued for the next bar; otherwise they move the cue.
        arrJump(d) {
          const i = Number(d.i);
          if (S.play.on) {
            const same = S.play.jump && S.play.jump.section && S.play.jump.arrIdx === i;
            S.play.jump = same ? null : { arrIdx: i, bar: 0, section: true };
          } else {
            S.cue = { arrIdx: i, lap: S.cue ? S.cue.lap : 0, bar: 0, paused: S.cue ? S.cue.paused : false };
          }
          render();
        },
        chipJump(d) {
          const ci = Number(d.ci);
          const { sec } = playerContext();
          const chord = sec && sec.chords[ci];
          if (!chord) return;
          const bar = Math.floor(chord.start / barTicks());
          if (S.play.on) {
            const same = S.play.jump && S.play.jump.chord === ci;
            S.play.jump = same ? null : { arrIdx: S.play.arrIdx, bar, chord: ci };
          } else {
            const cur = S.cue ? clampPos(liveSong(), S.cue) : { arrIdx: 0, lap: 0 };
            S.cue = { arrIdx: cur.arrIdx, lap: cur.lap, bar, paused: S.cue ? S.cue.paused : false };
          }
          render();
        },
        keyJump(d) {
          const i = Number(d.i);
          if (S.play.on) {
            S.play.keyJump = S.play.keyJump === i ? null : i;
          } else {
            const cur = S.cue ? clampPos(liveSong(), S.cue) : { arrIdx: 0, bar: 0 };
            S.cue = { arrIdx: cur.arrIdx, lap: i, bar: cur.bar, paused: S.cue ? S.cue.paused : false };
          }
          render();
        },
        stop() {
          stopPlay();
        },
        sharePractice() {
          S.sharePractice = !includePractice();
          render();
        },
        secDel() {
          if (S.song.sections.length < 2) return toast("A song needs at least one section");
          const id = S.view.sectionId;
          S.song.sections = S.song.sections.filter((s) => s.id !== id);
          S.song.arrangement = S.song.arrangement.filter((x) => x !== id);
          if (!S.song.arrangement.length) S.song.arrangement.push(S.song.sections[0].id);
          S.sheet = null;
          ACTIONS.backToSong();
          edited();
        },

        play() {
          S.play.on ? pausePlay() : startPlay();
        },
      };

      // Field edits (change events)
      function onField(field, value, d) {
        const r = S.recipe;
        const g = S.song;
        const sec = curSec();
        const num = (v) => (v === "" ? null : Number(v));
        switch (field) {
          case "recipe.key":
            r.key = value;
            break;
          case "recipe.tempo":
            r.tempo = num(value) || 96;
            break;
          case "recipe.style":
          case "recipe.drums":
          case "recipe.bass":
          case "recipe.voicing":
            r[field.split(".")[1]] = value;
            break;
          case "rsec.drums":
          case "rsec.bass":
            r.sections[d.i][field.split(".")[1]] = value || null;
            break;
          case "song.voicing":
            g.defaults.voicing = value;
            break;
          case "sec.voicing":
            if (value === "") delete sec.overrides.voicing;
            else sec.overrides.voicing = value;
            break;
          // Mixer: channel gains apply instantly, so these skip the "queued for next bar" path.
          case "mix.on":
            S.practice.mutes[d.ch] = !value;
            return render();
          case "mix.vol":
            S.mix[d.ch] = Number(value);
            return render();
          case "practice.cycle":
            S.practice.cycle = value;
            break;
          case "practice.customKeys": {
            const SHARP = { "C#": "Db", "D#": "Eb", "F#": "Gb", "G#": "Ab", "A#": "Bb" };
            const keys = value
              .split(/[\s,]+/)
              .filter(Boolean)
              .map((k) => k[0].toUpperCase() + k.slice(1).toLowerCase())
              .map((k) => SHARP[k] || k);
            const bad = keys.filter((k) => !KEYS.includes(k));
            if (bad.length) toast("Unknown key: " + bad.join(", "));
            S.practice.customKeys = keys.filter((k) => KEYS.includes(k));
            break;
          }
          case "rsec.name":
          case "rsec.progression":
            r.sections[d.i][field.split(".")[1]] = value;
            break;
          case "rsec.barsPerChord":
            r.sections[d.i].barsPerChord = Number(value);
            break;
          case "rsec.style":
            r.sections[d.i].style = value || null;
            break;
          case "rsec.tempo":
            r.sections[d.i].tempo = num(value);
            break;
          // The doc's title is the library item's name (one source of truth).
          case "song.title":
          case "doc.title":
            if (!value.trim()) return toast("A name can't be empty"), render();
            (field === "song.title" ? g : r).title = value.trim();
            break;
          case "song.key":
            g.key = value;
            break;
          case "song.tempo":
            g.defaults.tempo = num(value) || 96;
            break;
          case "song.swing":
            g.defaults.swing = Number(value);
            break;
          case "sec.name":
            sec.name = value;
            break;
          case "sec.tempo":
            if (value === "") delete sec.overrides.tempo;
            else sec.overrides.tempo = Number(value);
            break;
          case "sec.swing":
            if (value === "") delete sec.overrides.swing;
            else sec.overrides.swing = Number(value);
            break;
          case "sec.chordsPatch":
            if (value === "") delete sec.overrides.instruments;
            else sec.overrides.instruments = { chords: value };
            break;
          case "chordNumeral": {
            const p = parseNumeral(value);
            if (!p) return toast("Couldn't read “" + value + "”");
            Object.assign(sec.chords[S.view.selChord], p);
            break;
          }
          default:
            return;
        }
        edited();
      }

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el || el.disabled) return;
        const fn = ACTIONS[el.dataset.act];
        if (fn) fn(el.dataset);
      });
      document.addEventListener("change", (e) => {
        const el = e.target.closest("[data-field]");
        if (el) onField(el.dataset.field, el.type === "checkbox" ? el.checked : el.value, el.dataset);
      });
      // Live readout while dragging a mix slider (the change event commits it).
      document.addEventListener("input", (e) => {
        const el = e.target;
        if (el.dataset && el.dataset.field === "mix.vol") el.nextElementSibling.textContent = el.value;
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && S.sheet) ACTIONS.closeSheet();
      });

      openItem("scratch"); // first run: Scratch, pre-filled from a starter — never an empty app
    </script>
  </body>
</html>
