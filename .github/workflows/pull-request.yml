name: "Pull Request Checks"

on:
  pull_request:
    branches:
      - main

jobs:
  run_code_quality_and_tests:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"

      - name: "Install Dependencies"
        run: npm ci

      - name: "Run Code Quality Checks"
        run: npm run check

      # v2's engine tests render audio offline with node-web-audio-api, whose Linux
      # binary links against PipeWire even when no audio device is used.
      - name: "Install audio libraries for engine tests"
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-0t64 || sudo apt-get install -y libpipewire-0.3-0

      - name: "Run Tests"
        run: npm t

      - name: "Build the Code"
        run: npm run build
